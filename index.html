    let visibleCount = 10;
    const step = 10;

    function renderPapers(start = 0, end = visibleCount) {
		const grid = document.getElementById('papers-grid');

		papers.slice(start, end).forEach(paper => {
			const mediaHTML = paper.mediaType === 'video'
				? `<div class="media-container"><video src="${paper.mediaUrl}" muted loop autoplay playsinline></video></div>`
				: `<div class="media-container"><img src="${paper.mediaUrl}" alt="${paper.title}"></div>`;

			const card = document.createElement('div');
			card.className = 'paper-card';
			card.innerHTML = `
				${mediaHTML}
				<div class="paper-content">
					<div class="paper-period">${paper.period}</div>
					<div class="paper-title">${paper.title}</div>
					${paper.description ? `
					<div class="paper-description">
						${paper.description}
					</div>
					` : ''}

					<div class="conference">
						<a href="${paper.conferenceLink}" target="_blank"> Accepted in ${paper.conference} Conference </a>
					</div>
					<div class="paper-links">
						${paper.paperLink ? `<a href="${paper.paperLink}" class="paper-link" target="_blank"><span>🗐</span> View Full Paper</a>` : ''}
						${paper.codeLink ? `<a href="${paper.codeLink}" class="paper-link" target="_blank"><span>🖳</span> Source Code</a>` : ''}
					</div>
				</div>
			`;

			grid.appendChild(card);
		});

		if (visibleCount >= papers.length) {
			document.getElementById('load-more-btn').style.display = 'none';
		}
	}

    function displayPaperCount(total) {
        const el = document.getElementById('paper-count');
        let displayValue = total >= 10 ? Math.floor(total/10)*10 + "+" : total;
        el.textContent = displayValue;
    }

    const typingText = "Driving us to constantly challenge the status quo and create solutions that shape the future.";
    let index = 0;
    function typeEffect() {
        const el = document.getElementById("typing-text");
        if (index < typingText.length) {
            el.textContent += typingText.charAt(index);
            index++;
            setTimeout(typeEffect, 30);
        }
    }

    const conferences = [...new Set(papers.map(p => p.conference))];
    let confIndex = 0;
    function rotateConference() {
        const el = document.querySelector(".highlight-bg-text");
        el.style.opacity = 0;
        setTimeout(() => {
            confIndex = (confIndex + 1) % conferences.length;
            el.textContent = conferences[confIndex];
            el.style.opacity = 1;
        }, 300);
    }

    function startHighlightAnimation() {
        const baseText = "Peer-reviewed AI publications accepted by prestigious conferences";
		const el = document.getElementById("running-text");
		el.textContent = ` • ${baseText} • ${baseText} • ${baseText} • `;
        setInterval(rotateConference, 3000);
    }

	function waitForMediaLoad(container, callback) {
		const media = container.querySelectorAll('img, video');
		let loaded = 0;
		const total = media.length;

		if (total === 0) return callback();

		function check() {
			loaded++;
			if (loaded >= total) callback();
		}

		media.forEach(el => {
			let done = false;

			const onceCheck = () => {
				if (!done) {
					done = true;
					check();
				}
			};

			if (
				(el.tagName === "IMG" && el.complete) ||
				(el.tagName === "VIDEO" && el.readyState >= 3)
			) {
				onceCheck();
			} else {
				el.addEventListener('load', onceCheck, { once: true });
				el.addEventListener('loadeddata', onceCheck, { once: true });
				el.addEventListener('error', onceCheck, { once: true });
			}
		});
	}

    document.getElementById('load-more-btn').addEventListener('click', (e) => {
		const btn = e.target;

		btn.textContent = "Loading...";
		btn.disabled = true;
		btn.style.opacity = "0.6";

		const prevCount = visibleCount;
		visibleCount += step;

		renderPapers(prevCount, visibleCount);

		const grid = document.getElementById('papers-grid');
		const newCards = Array.from(grid.children).slice(prevCount);

		waitForMediaLoad({ querySelectorAll: () => {
			return newCards.flatMap(card => 
				Array.from(card.querySelectorAll('img, video'))
			);
		}}, () => {
			btn.textContent = "Load More";
			btn.disabled = false;
			btn.style.opacity = "1";

			if (visibleCount >= papers.length) {
				btn.style.display = 'none';
			}
		});
	});

    window.onload = () => {
        renderPapers();
        displayPaperCount(papers.length);
        typeEffect();
        startHighlightAnimation();
    };
</script>
